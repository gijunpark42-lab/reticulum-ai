[server]
# Serve files in ./static at /app/static/... — used for company logos.
enableStaticServing = true

[theme]
# Dark theme so native widgets — especially st.dataframe (a canvas grid that CSS can't
# recolor) — match the custom dark palette in app.py (:root --ap-* vars). Without this,
# Streamlit falls back to its light theme and tables render as a white box that clashes
# with the dark page. Colors mirror --ap-bg / --ap-surface / --ap-text / --ap-blue.
base = "dark"
primaryColor = "#2997ff"
backgroundColor = "#0a0c10"
secondaryBackgroundColor = "#14171c"
textColor = "#f5f5f7"
